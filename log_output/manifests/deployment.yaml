apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-deployment
  labels:
    app: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata: 
      labels:
        app: log-output
    spec:
      volumes:
        - name: logout
          emptyDir:
            sizeLimit: 5Gi
      containers:
        - name: generate-log
          image: popcorn27/generate-log:v1 
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: /log
              name: logout

        - name: web-log
          image: popcorn27/web-log:v1
          imagePullPolicy: Always                    
          volumeMounts:
            - mountPath: /log
              name: logout




