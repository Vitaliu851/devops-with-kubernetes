apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dwk-log-output-ingress
spec: 
  rules:
  - host: log.localtest.my
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: log-output-svc
            port:
              number: 2002

      - path: /pinpong
        pathType: Prefix
        backend:
          service:
            name: pinpong-svc
            port:
              number: 2003
